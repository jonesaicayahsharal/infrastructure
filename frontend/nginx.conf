# Main site (solutions)
server {
    listen 80;
    server_name solutions.yasharal.vip;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

# Redirect for solar
server {
    listen 80;
    server_name solutions.yasharal;

    location / {
        return 301 https://solutions.yasharal.vip$request_uri;  # Redirects to primary site
    }
}
